<section id="home" class="hero dark-section">
  <!-- Shader SVG Definitions -->
  <svg class="shader-defs" aria-hidden="true">
    <defs>
      <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="coloredBlur" />
        <feMerge>
          <feMergeNode in="coloredBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glass-effect" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence baseFrequency="0.005" numOctaves="1" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.3" />
        <feColorMatrix type="matrix" values="1 0 0 0 0.02 0 1 0 0 0.02 0 0 1 0 0.05 0 0 0 0.9 0" result="tint" />
      </filter>
    </defs>
  </svg>

  <!-- Background animado -->
  <div class="hero-animated-bg"></div>
  <div class="overlay"></div>

  <div class="container hero-container">
    <div class="hero-layout">
      <!-- Coluna da Esquerda: Textos e Botões -->
      <div class="hero-content" #heroContent>
        <h1 class="hero-title" style="filter: url(#text-glow);">
          <span class="block text-white mb-2 tracking-wider">Transformando Espaços com</span>
          <span class="block font-black text-white drop-shadow-2xl"> Excelência</span>
        </h1>
        <p class="hero-subtitle">
          Materiais para sua obra e reforma com qualidade e preço justo.
        </p>
        <div class="hero-actions">
          <a href="#servicos" class="btn btn-primary shadow-lg hover:shadow-xl">Conheça nossos serviços</a>
          <a href="https://wa.me/553188737519" target="_blank" class="btn btn-secondary glass"
            style="filter: url(#glass-effect);">Fale Conosco</a>
        </div>
      </div>

      <!-- Coluna da Direita: Vídeo -->
      <div class="hero-video-wrapper">
        <video #heroVideo autoplay loop muted playsinline class="inline-video">
          <source src="/chroma-keyed-video-muted.webm" type="video/webm">
        </video>
      </div>
    </div>
  </div>
</section>
