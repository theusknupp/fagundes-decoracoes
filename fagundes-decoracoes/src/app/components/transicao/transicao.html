<section class="transicao dark-section" #transicaoContainer>
  <div class="transicao-content">
    <div class="svg-container">
      <!-- Architectonic SVG: Building / Blueprint style -->
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="architecture-svg">
        <g stroke="var(--color-primary-red)" stroke-width="2" fill="none" class="svg-paths">
          <!-- House / Building lines -->
          <path class="svg-part" d="M200 50 L350 150 L350 350 L50 350 L50 150 Z" />
          <path class="svg-part" d="M200 50 L200 350" />
          <path class="svg-part" d="M50 250 L350 250" />
          <path class="svg-part" d="M125 150 L125 350" />
          <path class="svg-part" d="M275 150 L275 350" />
          <path class="svg-part" d="M50 150 L200 100 L350 150" />
        </g>
        <g fill="var(--color-primary-yellow)" class="svg-nodes">
          <!-- Intersection nodes -->
          <circle class="svg-part" cx="200" cy="50" r="5" />
          <circle class="svg-part" cx="350" cy="150" r="5" />
          <circle class="svg-part" cx="350" cy="350" r="5" />
          <circle class="svg-part" cx="50" cy="350" r="5" />
          <circle class="svg-part" cx="50" cy="150" r="5" />
          <circle class="svg-part" cx="200" cy="350" r="5" />
          <circle class="svg-part" cx="50" cy="250" r="5" />
          <circle class="svg-part" cx="350" cy="250" r="5" />
          <circle class="svg-part" cx="200" cy="250" r="5" />
          <circle class="svg-part" cx="125" cy="150" r="5" />
          <circle class="svg-part" cx="275" cy="150" r="5" />
          <circle class="svg-part" cx="125" cy="350" r="5" />
          <circle class="svg-part" cx="275" cy="350" r="5" />
        </g>
      </svg>
    </div>
    
    <div class="impact-text" #impactText>
      <h2>Estruturas Sólidas.</h2>
      <h2>Design Impecável.</h2>
    </div>
  </div>
</section>
